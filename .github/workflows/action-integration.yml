# Integration test for the composite action, using examples/quickstart as the sample repository.
name: Action integration

on:
  pull_request:
    paths: ["integrations/github-action/**", "src/**", ".github/workflows/action-integration.yml"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Create baseline from v1 predictions
        run: |
          pip install .
          osel eval run examples/quickstart/config.yaml --output /tmp/baseline.json

      - name: No regression (v1 vs v1) passes
        uses: ./integrations/github-action
        with:
          config: examples/quickstart/config.yaml
          baseline: /tmp/baseline.json
          osel-version: "."

      - name: Regression (v2 vs v1) in warn mode passes with warning
        uses: ./integrations/github-action
        with:
          config: examples/quickstart/config_v2.yaml
          baseline: /tmp/baseline.json
          mode: warn
          osel-version: "."

      - name: Regression in fail mode fails
        id: should_fail
        continue-on-error: true
        uses: ./integrations/github-action
        with:
          config: examples/quickstart/config_v2.yaml
          baseline: /tmp/baseline.json
          osel-version: "."
      - run: test "${{ steps.should_fail.outcome }}" = "failure"

      - name: Missing baseline with warn passes
        uses: ./integrations/github-action
        with:
          config: examples/quickstart/config.yaml
          baseline: /tmp/does-not-exist.json
          missing-baseline: warn
          osel-version: "."
