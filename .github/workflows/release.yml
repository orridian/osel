# Builds release artifacts from a version tag, never from a laptop.
# Publishing to PyPI uses Trusted Publishing (no API token stored). Configure the
# "pypi" environment and the trusted publisher on PyPI before the first release.
name: Release

on:
  push:
    tags: ["v*"]
  # DRY RUN: Actions tab > Release > "Run workflow". Runs every check and builds, checksums and
  # uploads the artifacts, but the release and PyPI jobs are skipped (they require a tag push).
  #
  # PUBLISH AN EXISTING RELEASE TO PYPI: "Run workflow" with publish_tag = e.g. v0.1.0a1.
  # Uploads the exact files already attached to that GitHub release (after verifying their
  # SHA256SUMS), so PyPI gets the same artifacts that were audited and attested. Nothing is rebuilt.
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Existing release tag to publish to PyPI (leave empty for a dry run)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: ruff check . && mypy src && pytest
      - name: Check tag matches package version
        if: github.event_name == 'push'
        run: |
          version=$(python -c "import osel; print(osel.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - run: python -m build
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - name: Create GitHub release (notes are edited from CHANGELOG.md before publishing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versions like 0.1.0a1 / 0.2.0rc1 / 0.1.0.dev0 are published as pre-releases.
          prerelease=""
          if echo "$GITHUB_REF_NAME" | grep -Eq '(a|b|rc|\.dev)[0-9]+$'; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft $prerelease \
            --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md and docs/known-limitations.md"

  pypi:
    # OFF until reviewed: publishing happens only when the repository variable
    # PUBLISH_TO_PYPI is set to "true" (Settings > Secrets and variables > Actions > Variables),
    # AND a maintainer approves the "pypi" environment. Turn it on only after the license, package
    # metadata and Trusted Publisher configuration have been reviewed.
    if: vars.PUBLISH_TO_PYPI == 'true' && github.event_name == 'push'
    needs: github-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - run: rm dist/SHA256SUMS.txt
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  pypi-from-release:
    if: >-
      vars.PUBLISH_TO_PYPI == 'true' && github.event_name == 'workflow_dispatch'
      && startsWith(inputs.publish_tag, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify the release's own artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.publish_tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          cd dist && sha256sum -c SHA256SUMS.txt && rm SHA256SUMS.txt
          ls -l
          # The package version inside the wheel must match the tag.
          wheel=$(ls *.whl)
          case "$wheel" in "osel-${TAG#v}-"*) ;; *) echo "wheel $wheel does not match $TAG"; exit 1;; esac
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
