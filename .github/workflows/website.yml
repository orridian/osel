# PR check for the website + docs. Builds under a sub-path (/osel/) so that any link that
# ignores the base path (and would break on GitHub Pages) fails the link check.
name: Website

on:
  pull_request:
    paths: ["website/**", "docs/**", "mkdocs.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: pip install -e ".[docs]" && mkdocs build --strict --site-dir website/public/docs
        env:
          OSEL_DOCS_URL: https://example.org/osel/docs/
      - working-directory: website
        env:
          OSEL_BASE: /osel/
        run: |
          npm ci
          npm run build
          npm run check-links
