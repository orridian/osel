# Deploys the website (/) and the documentation (/docs/) to GitHub Pages.
# Free, needs no domain or payment. Enable once: Settings > Pages > Source: "GitHub Actions".
# Without a custom domain the site lives at https://<org>.github.io/<repo>/ and the base path
# is set automatically. With a custom domain, configure it in Settings > Pages.
name: Pages

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", "mkdocs.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build docs into the website's /docs/
        env:
          OSEL_DOCS_URL: ${{ steps.pages.outputs.base_url }}/docs/
        run: |
          pip install -e ".[docs]"
          mkdocs build --strict --site-dir website/public/docs
      - name: Build website
        working-directory: website
        env:
          OSEL_SITE: ${{ steps.pages.outputs.origin }}
          OSEL_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build
          npm run check-links
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
